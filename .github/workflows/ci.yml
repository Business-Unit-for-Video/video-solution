name: Video Processing Pipeline

on:
  workflow_dispatch:
    inputs:
      channel_url:
        description: 'YouTube Channel/Playlist URL'
        required: true
        type: string
      video_limit:
        description: 'Max videos to process (0 = all)'
        required: false
        default: '1'
        type: string
      target_language:
        description: 'Target translation language'
        required: false
        default: 'en'
        type: choice
        options:
          - en
          - zh
          - ja
          - es

jobs:
  process-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Setup cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "$YOUTUBE_COOKIES" > cookies.txt
      
      - name: Setup API keys
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "OPENAI_API_KEY=$OPENAI_API_KEY" >> $GITHUB_ENV
          echo "HF_TOKEN=$HF_TOKEN" >> $GITHUB_ENV
      
      - name: Step 1 - Fetch video list
        run: |
          python -m src.video_solution.cli fetch-list \
            --channel-url "${{ inputs.channel_url }}" \
            --cookies cookies.txt \
            --out output/list.json \
            --format json
      
      - name: Step 2 - Download audio
        run: |
          python scripts/download_batch.py \
            --manifest output/list.json \
            --limit ${{ inputs.video_limit }} \
            --cookies cookies.txt \
            --out output/audio
      
      - name: Step 3 - Transcribe
        run: |
          python scripts/transcribe_batch.py \
            --manifest output/list.json \
            --audio-dir output/audio \
            --out output/transcripts
      
      - name: Step 4 - Generate chapters
        run: |
          python scripts/generate_chapters.py \
            --transcripts output/transcripts \
            --out output/chapters.json
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: processed-videos
          path: |
            output/list.json
            output/chapters.json
            output/transcripts/
          retention-days: 30
      
      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f cookies.txt
          rm -f .env
